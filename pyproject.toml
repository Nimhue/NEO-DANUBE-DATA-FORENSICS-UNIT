[project]
name = "neo-danube-dfu"
version = "1.0.0"
description = "Data Forensics Unit: a Databricks lakehouse where every pipeline is an investigation"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 160
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
